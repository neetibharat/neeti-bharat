name: CI

on:
  push:
    branches: [main]
  pull_request:

# The checks only read the code, so the token that the job gets can only read it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # An empty database for Prisma to replay the migrations in.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dpdp
          POSTGRES_PASSWORD: dpdp
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dpdp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: End-to-end tests
        env:
          E2E_DATABASE_URL: postgresql://dpdp:dpdp@localhost:5432/postgres
        run: pnpm test:e2e
      - name: Migrations match the schema
        working-directory: apps/api
        env:
          SHADOW_DATABASE_URL: postgresql://dpdp:dpdp@localhost:5432/shadow
        run: pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      - run: pnpm build
