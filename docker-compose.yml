services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dpdp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dpdp}
      POSTGRES_DB: dpdp
    ports:
      - '127.0.0.1:5440:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dpdp']
      interval: 5s
      timeout: 3s
      retries: 10

  # File storage for proof, for development. Any S3-compatible service works in its place (see docs/self-hosting.md).
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    # A fresh named volume is owned by root, and the image's own user cannot write to it.
    user: '0:0'
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-dpdpminio}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-dpdpminio-secret}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - miniodata:/data

  # Creates the bucket once MinIO answers, then exits.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    restart: on-failure
    environment:
      MC_HOST_local: http://${STORAGE_ACCESS_KEY_ID:-dpdpminio}:${STORAGE_SECRET_ACCESS_KEY:-dpdpminio-secret}@minio:9000
    command: mb --ignore-existing local/${STORAGE_BUCKET:-dpdp-proof}

volumes:
  pgdata:
  miniodata:
