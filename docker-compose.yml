services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nitibharat
      POSTGRES_PASSWORD: nitibharat
      POSTGRES_DB: nitibharat
    ports:
      - '5440:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nitibharat']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
