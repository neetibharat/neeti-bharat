services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dpdp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dpdp}
      POSTGRES_DB: dpdp
    ports:
      - '127.0.0.1:5440:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dpdp']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
